openapi: 3.0.0
info:
  title: Bluestock SaaS Village API
  description: |
    Production-grade REST API providing hierarchical geographical data for all 570,000+ Indian villages.
    
    ## Authentication
    All API requests require an `X-API-Key` header. Write operations also require `X-API-Secret`.
    
    ## Rate Limits
    | Plan | Daily Requests | Burst (per min) |
    |------|---------------|-----------------|
    | Free | 5,000 | 100 |
    | Premium | 50,000 | 500 |
    | Pro | 300,000 | 2,000 |
    | Unlimited | 1,000,000 | 5,000 |
    
    ## Quick Start
    ```bash
    # 1. Get your API key from the B2B portal
    # 2. Make your first request:
    curl -H "X-API-Key: ak_YOUR_KEY_HERE" http://localhost:3000/api/v1/states
    ```
  version: 1.0.0
  contact:
    name: API Support
    email: support@villageapi.com

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
  - url: https://api.villageapi.com/v1
    description: Production Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Provide your active B2B API Key (ak_XXXX)
    ApiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
      description: Required for write operations (as_XXXX)

security:
  - ApiKeyAuth: []

paths:
  /keys:
    get:
      summary: List API Keys
      description: Retrieves all API keys for the current authenticated user.
      tags: [Authentication]
      responses:
        '200':
          description: A list of API key mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array }
    post:
      summary: Generate New API Key Pair
      description: |
        Creates a new `ak_` public key and `as_` secret token. 
        **The secret is returned exactly ONCE.** Store it securely.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Production Server"
      responses:
        '200':
          description: Successfully generated the key pair

  /states:
    get:
      summary: List All States
      description: Returns all Indian States and Union Territories.
      tags: [Geography]
      responses:
        '200':
          description: Array of states
          content:
            application/json:
              example:
                success: true
                count: 36
                data:
                  - { id: 1, name: "Maharashtra", code: "27" }

  /states/{id}/districts:
    get:
      summary: Districts by State
      tags: [Geography]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
          description: State ID
      responses:
        '200':
          description: List of districts in the state
        '403':
          description: Access denied — plan does not cover this state

  /districts/{id}/subdistricts:
    get:
      summary: Sub-Districts by District
      tags: [Geography]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: List of sub-districts

  /subdistricts/{id}/villages:
    get:
      summary: Villages by Sub-District
      tags: [Geography]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 500 }
      responses:
        '200':
          description: Paginated list of villages

  /search:
    get:
      summary: Search Villages
      description: Full-text search across all village records with hierarchical filtering.
      tags: [Search]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: Search term (min 2 characters)
        - in: query
          name: state
          schema: { type: string }
          description: Filter by state name
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: subDistrict
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Matching villages with full hierarchy
          content:
            application/json:
              example:
                success: true
                count: 3
                data:
                  - value: "village_id_525002"
                    label: "Manibeli"
                    fullAddress: "Manibeli, Akkalkuwa, Nandurbar, Maharashtra, India"
                    hierarchy:
                      village: "Manibeli"
                      subDistrict: "Akkalkuwa"
                      district: "Nandurbar"
                      state: "Maharashtra"
                      country: "India"

  /autocomplete:
    get:
      summary: Typeahead Autocomplete
      description: |
        Ultra-fast fuzzy matching using PostgreSQL `pg_trgm`. Designed for real-time dropdown suggestions.
        
        **Code Examples:**
        
        ### cURL
        ```bash
        curl -H "X-API-Key: ak_YOUR_KEY" \
          "http://localhost:3000/api/v1/autocomplete?q=mane"
        ```
        
        ### JavaScript (fetch)
        ```javascript
        const res = await fetch('/api/v1/autocomplete?q=mane', {
          headers: { 'X-API-Key': 'ak_YOUR_KEY' }
        });
        const data = await res.json();
        console.log(data.data); // [{label: "Manibeli", fullAddress: "..."}]
        ```
        
        ### Python (requests)
        ```python
        import requests
        r = requests.get('http://localhost:3000/api/v1/autocomplete',
          params={'q': 'mane'},
          headers={'X-API-Key': 'ak_YOUR_KEY'})
        print(r.json()['data'])
        ```
        
        ### PHP (cURL)
        ```php
        $ch = curl_init();
        curl_setopt($ch, CURLOPT_URL, "http://localhost:3000/api/v1/autocomplete?q=mane");
        curl_setopt($ch, CURLOPT_HTTPHEADER, ["X-API-Key: ak_YOUR_KEY"]);
        curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
        $response = curl_exec($ch);
        echo $response;
        ```
      tags: [Search]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: Search term (min 2 characters)
        - in: query
          name: hierarchyLevel
          schema: { type: string, enum: [village, subDistrict, district, state] }
      responses:
        '200':
          description: Autocomplete suggestions with full hierarchy
        '400':
          description: Query too short or invalid

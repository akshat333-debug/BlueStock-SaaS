openapi: 3.0.0
info:
  title: Bluestock SaaS Village API
  description: Access authentic geographical and topological village data for India, mapping Country -> States -> Districts -> SubDistricts -> Villages natively.
  version: 1.0.0
  contact:
    name: API Support
    email: support@villageapi.com

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Provide your active B2B API Key (ak_XXXX) to access data.

security:
  - ApiKeyAuth: []

paths:
  /keys:
    get:
      summary: Retrieves all generated API Keys
      description: Restricted endpoint to list your associated active keys.
      tags:
        - Authentication
      responses:
        '200':
          description: A list of API key mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
        '401':
          description: Unauthorized request
    post:
      summary: Generates a new API Key Pair
      description: Creates a new public key and secret token. The secret token is returned exactly ONCE successfully hashing it into the database for validation.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "B2B Production App"
      responses:
        '200':
          description: Successfully generated the key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                        example: "ak_5103d5ed..."
                      secret:
                        type: string
                        example: "as_a52bf..."

  /states:
    get:
      summary: Retrieve standard States mapping
      description: Returns all Indian States/UTs available on the mapping hierarchy.
      tags:
        - Geographic Nodal Navigation
      responses:
        '200':
          description: A list of States
        '429':
          description: Rate limited (Too Many Requests)

  /states/{id}/districts:
    get:
      summary: Retrieve Districts via State ID
      tags:
        - Geographic Nodal Navigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The ID of the parent State.
      responses:
        '200':
          description: List of connected districts
        '403':
          description: Unauthorized state-hierarchy access due to Plan restrictions.

  /districts/{id}/subdistricts:
    get:
      summary: Retrieve SubDistricts via District ID
      tags:
        - Geographic Nodal Navigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of connected sub-districts
          
  /subdistricts/{id}/villages:
    get:
      summary: Retrieve Villages via SubDistrict ID
      tags:
        - Geographic Nodal Navigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of connected villages. Provides full metadata (Pincodes, MDDS, and Coordinates).

  /autocomplete:
    get:
      summary: Fuzzy Match Village AutoComplete
      description: Extremely fast pattern matching search bridging `pg_trgm` logic. Designed to connect instantly with frontend text input drops.
      tags:
        - Search Analytics
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search term (min 2 characters) for the Village Name (e.g. "Juhu").
      responses:
        '200':
          description: Returns an array of highly-mapped matched formats.
        '400':
          description: Malformed query payload.
